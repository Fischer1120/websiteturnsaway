      <stop offset="0" stop-color="#11151A"/>
      <stop offset=".42" stop-color="#181E24"/>
      <stop offset="1" stop-color="#9BA6B2"/>
    </linearGradient>
    <radialGradient id="sphere" cx="28%" cy="24%" r="72%">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset=".38" stop-color="#79D7E5"/>
      <stop offset=".8" stop-color="#F06D52"/>
      <stop offset="1" stop-color="#080A0D"/>
    </radialGradient>
  </defs>
  <rect width="900" height="640" fill="url(#paper)"/>
  <path d="M104 572 392 168 492 572Z" fill="#080A0D" opacity=".34"/>
