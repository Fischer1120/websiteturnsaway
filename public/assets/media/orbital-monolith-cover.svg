<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Orbital monolith cover</title>
  <desc id="desc">A retro-future sphere, monolith, and pyramid in a graphite orbital field.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#080A0D"/>
      <stop offset="0.48" stop-color="#11151A"/>
      <stop offset="1" stop-color="#181E24"/>
    </linearGradient>
    <radialGradient id="orb" cx="32%" cy="26%" r="68%">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset="0.35" stop-color="#79D7E5"/>
      <stop offset="0.75" stop-color="#F06D52"/>
      <stop offset="1" stop-color="#080A0D"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.9" numOctaves="2" seed="7" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA slope="0.12" type="linear"/>
      </feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <path d="M210 694 640 250 980 694Z" fill="#9BA6B2" opacity=".28"/>
  <path d="M324 708 650 307 760 708Z" fill="#080A0D" opacity=".48"/>
  <ellipse cx="560" cy="548" rx="290" ry="42" fill="#080A0D" opacity=".5"/>
  <circle cx="474" cy="266" r="190" fill="#080A0D" opacity=".42"/>
  <circle cx="444" cy="236" r="190" fill="url(#orb)" stroke="#080A0D" stroke-width="8"/>
  <circle cx="376" cy="160" r="42" fill="#F5F7FA" opacity=".92"/>
  <rect x="670" y="178" width="88" height="450" fill="#080A0D"/>
  <rect x="758" y="188" width="42" height="438" fill="#9BA6B2"/>
  <path d="M810 624 1045 624 932 310Z" fill="#080A0D"/>
  <path d="M932 310 1045 624 902 526Z" fill="#F5F7FA"/>
  <path d="M902 526 1045 624 823 624Z" fill="#F06D52"/>
  <path d="M248 660 364 316" stroke="#9BA6B2" stroke-linecap="square" stroke-width="22" opacity=".28"/>
  <g fill="#F5F7FA" font-family="Courier New, monospace" font-size="23" letter-spacing="2">
    <text x="80" y="84">ORBITAL MONOLITH INDEX / 1976</text>
    <text x="880" y="130">SHANGHAI / CITY</text>
    <text x="78" y="732">AZIMUTH 18:42</text>
  </g>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".65"/>
</svg>
